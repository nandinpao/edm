      - mailbox
    
  subscribe:
    image: mail-subscribe
    container_name: subscribe-node1
    build:
      context: mail-subscribe/setting
    restart: on-failure
    volumes:
      - ./log/mail-subscribe:/usr/agitg/log
    ports:
      - "9095:80"
    environment:
      DB_WRITE_IP: ${ip}
      DB_WRITE_PORT: 3316
      DB_READ_IP: ${ip}
      DB_READ_PORT: 3316
      DB_USER: root
      DB_PASSWORD: 123456
      CONSULE_HOST: ${ip}
      CONSULE_PORT: 8500
    depends_on: 
      - mailbox
    


