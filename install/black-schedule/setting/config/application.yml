server:
  port: 9040
  servlet:
    context-path: /black-schedule

management:
  endpoints:
    web:
      exposure:
        include: "*"
    health:
      show-details: always

spring:
  application:
    name: black-schedule

  cloud:
    consul:
      host: ${CONSULE_HOST}
      port: ${CONSULE_PORT}
      discovery:
        service-name: black-schedule
        health-check-path: /actuator/health
        prefer-ip-address: true
        ip-address: ${CONSULE_HOST}
        heartbeat:
          enabled: true
  data:
    redis:
      database: 0
      password:
      timeout: 30000
      mode: ${REDIS_MODE}
      pool:
        maxIdle: 16
        minIdle: 8
        maxActive: 8
        maxWait: 3000
        connTimeout: 3000
        soTimeout: 3000
        size: 10
      single:
        address: ${REDIS_HOST}
      cluster:
        scanInterval: 1000
        nodes: ${REDIS_HOST}
        readMode: SLAVE
        retryAttempts: 3
        failedAttempts: 3
        slaveConnection-pool-size: 64
        masterConnection-pool-size: 64
        retryInterval: 1500
      sentinel:
        master: business-master
        nodes:
        masterOnlyWrite: true
        failMax: 3

mqueue:
  artemis:
    id: Black-Schedule
    server: (${ARTEMIS_HOST})
    user: ${ARTEMIS_USER}
    password: ${ARTEMIS_PASSWORD}
    maxConnection: 1000
    connectionTimeout: 30000
    expiryTimeout: 0
    idleTimeout: 30000
    prefetchSize: 1
    maximumActiveSessionPerConnection: 1
    connectionCheckInterval: 10000
    retryInterval: 3000
